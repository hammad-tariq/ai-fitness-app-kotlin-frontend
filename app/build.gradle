def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}

def escapeForBuildConfig = { String value ->
    value.replace("\\", "\\\\").replace("\"", "\\\"")
}

def fitnessApiKey = escapeForBuildConfig(localProperties.getProperty("FITNESS_API_KEY", "4df0c34638f84d2cc2ae4575fcf08a52b0a6fabb55bea4118ad4db7dabcd8711"))
def fitnessAdminApiKey = escapeForBuildConfig(localProperties.getProperty("FITNESS_ADMIN_API_KEY", "26646a6935fb5b1a36ab56c4d2054ecff541dab393ba44393010ab092d444954"))
def fitnessApiBaseUrl = escapeForBuildConfig(
        localProperties.getProperty("FITNESS_API_BASE_URL", "https://fitness.aimtech.tech")
)

android {
    namespace 'com.pro.aifitnesstracker'
    compileSdk {
        version = release(37)
    }

    defaultConfig {
        applicationId "com.pro.aifitnesstracker"
        minSdk 24
        targetSdk 37
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "FITNESS_API_BASE_URL", "\"${fitnessApiBaseUrl}\""
        buildConfigField "String", "FITNESS_API_KEY", "\"${fitnessApiKey}\""
        buildConfigField "String", "FITNESS_ADMIN_API_KEY", "\"${fitnessAdminApiKey}\""
    }

    buildTypes {
        release {
            optimization {
                enable false
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildFeatures {
        compose true
        buildConfig true
    }
}

